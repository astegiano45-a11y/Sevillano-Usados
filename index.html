<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sevillano Content OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: barra superior de marca + tabs, vistas operativas en grilla; tarjetas codificadas por pilar */
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --fg:#0D1424; --muted:#5D6880; --line:#E2E7F0;
  --accent:#0A57FF; --accent-soft:#E6EEFF; --navy:#0B1F4D;
  --valor:#0A57FF; --valor-soft:#E6EEFF;
  --exp:#0E9F6E; --exp-soft:#E1F5EC;
  --prod:#F06A1A; --prod-soft:#FDEBDF;
  --warn:#C2410C; --ok:#0E9F6E;
  --f-display:"Archivo","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0F1C; --surface:#121A2C; --fg:#E8EDF7; --muted:#93A0BA; --line:#22304B;
  --accent:#4D86FF; --accent-soft:#16264A; --navy:#E8EDF7;
  --valor:#5B8FFF; --valor-soft:#16264A; --exp:#34C792; --exp-soft:#0F3026; --prod:#FF8A45; --prod-soft:#3A2214;
  --warn:#FF8A45; --ok:#34C792; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0F1C; --surface:#121A2C; --fg:#E8EDF7; --muted:#93A0BA; --line:#22304B;
  --accent:#4D86FF; --accent-soft:#16264A; --navy:#E8EDF7;
  --valor:#5B8FFF; --valor-soft:#16264A; --exp:#34C792; --exp-soft:#0F3026; --prod:#FF8A45; --prod-soft:#3A2214;
  --warn:#FF8A45; --ok:#34C792; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding-block:14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:900;letter-spacing:.02em;font-size:18px;color:var(--navy);text-transform:uppercase}
.brand small{display:block;font-family:var(--f-mono);font-weight:500;font-size:10px;letter-spacing:.18em;color:var(--accent)}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav button{border:0;background:none;font:600 14px var(--f-body);color:var(--muted);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--accent);color:#fff}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:22px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(22px,3vw,30px);font-weight:900}
h2{font-size:18px;font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 13px var(--f-body);padding:8px 14px;border-radius:999px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--warn)}
.sub{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
/* pilares */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
.p-valor{background:var(--valor-soft);color:var(--valor)}
.p-exp{background:var(--exp-soft);color:var(--exp)}
.p-prod{background:var(--prod-soft);color:var(--prod)}
.p-none{background:var(--line);color:var(--muted)}
.chip{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
/* hoy */
.today-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:18px}
@media(max-width:860px){.today-grid{grid-template-columns:1fr}}
.week{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:620px){.week{grid-template-columns:1fr}}
.slot{border-radius:var(--r);padding:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0;cursor:pointer}
.slot .day{font-family:var(--f-display);font-weight:900;font-size:22px}
.slot.valor{border-top:4px solid var(--valor)} .slot.exp{border-top:4px solid var(--exp)} .slot.prod{border-top:4px solid var(--prod)}
.slot .t{font-weight:700}
.empty{color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:10px;padding:12px;text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat .n{font-family:var(--f-display);font-weight:900;font-size:28px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.item:hover{border-color:var(--accent)}
.item .when{font-family:var(--f-mono);font-size:11px;color:var(--muted);min-width:64px}
.item .txt{flex:1;min-width:0}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.check{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;cursor:pointer;background:none;padding:0}
.check.on{background:var(--ok);border-color:var(--ok)}
.kind{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.k-reunion{color:var(--accent)} .k-evento{color:var(--prod)} .k-tarea{color:var(--muted)}
/* calendario */
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.cal-head div{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding-left:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.cell{min-height:118px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.cell.out{opacity:.45}
.cell.pub{background:linear-gradient(var(--surface),var(--surface)) padding-box}
.cell .num{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.cell.today .num b{background:var(--accent);color:#fff;border-radius:6px;padding:0 6px}
.cell .add{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 4px;opacity:0}
.cell:hover .add,.cell:focus-within .add{opacity:1}
.ev{font-size:11.5px;font-weight:600;padding:3px 6px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.valor{background:var(--valor-soft);color:var(--valor)} .ev.exp{background:var(--exp-soft);color:var(--exp)} .ev.prod{background:var(--prod-soft);color:var(--prod)}
.ev.task{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.ev.pubd{text-decoration:line-through;opacity:.7}
.cell .tag{font-family:var(--f-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
@media(max-width:700px){.cal-head{display:none}.cal{grid-template-columns:1fr}.cell{min-height:auto}.cell.out{display:none}.cell .add{opacity:1}}
.legend{display:flex;gap:8px;flex-wrap:wrap}
/* kanban */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;margin-top:16px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col h3{font-size:13px;display:flex;justify-content:space-between;align-items:center}
.col h3 span{font-family:var(--f-mono);color:var(--muted);font-weight:500}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:grab;display:flex;flex-direction:column;gap:6px}
.kcard.valor{border-left:4px solid var(--valor)} .kcard.exp{border-left:4px solid var(--exp)} .kcard.prod{border-left:4px solid var(--prod)}
.kcard .meta{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.mv{display:flex;gap:4px}
.mv button{border:1px solid var(--line);background:none;border-radius:6px;font-size:12px;cursor:pointer;color:var(--muted);padding:1px 7px}
/* ideas */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;font:600 12px var(--f-body);padding:5px 12px;cursor:pointer;color:var(--fg)}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}
.idea{display:flex;flex-direction:column;gap:8px;cursor:pointer}
.idea .hook{font-family:var(--f-display);font-weight:700;font-size:15px}
.prio{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.prio.alta{color:var(--warn)}
/* marca */
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
@media(max-width:860px){.pillars{grid-template-columns:1fr}}
.pillar{border-top:5px solid}
.pillar.valor{border-top-color:var(--valor)} .pillar.exp{border-top-color:var(--exp)} .pillar.prod{border-top-color:var(--prod)}
.pillar .dayb{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ed{border-radius:6px;padding:2px 4px;margin:-2px -4px;outline:none}
.ed:hover{background:var(--bg)}
.ed:focus{background:var(--accent-soft)}
ul.subs{padding-left:18px;margin:8px 0 0}
/* modal */
dialog{border:0;border-radius:16px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 40px);background:var(--surface);color:var(--fg);box-shadow:0 24px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(8,14,30,.5)}
.mh{padding:18px 20px 0;display:flex;align-items:center;gap:10px}
.mb{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mb .full{grid-column:1/-1}
@media(max-width:520px){.mb{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
input,select,textarea{font:500 14px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:80px;resize:vertical}
.mf{padding:0 20px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:50}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 12px var(--f-body);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
@media(prefers-reduced-motion:no-preference){.kcard,.slot,.item{transition:border-color .15s,transform .15s}.kcard:hover{transform:translateY(-1px)}}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">Sevillano Usados<small>Content OS</small></div>
      <button class="sync btn ghost" id="syncBtn" type="button"><span class="dot" id="dot"></span><span id="syncTxt">Cargando…</span></button>
    </div>
    <nav role="tablist" id="tabs">
      <button role="tab" data-v="hoy" aria-selected="true">Inicio</button>
      <button role="tab" data-v="cal">Calendario</button>
      <button role="tab" data-v="prod">Producción</button>
      <button role="tab" data-v="ideas">Banco de ideas</button>
      <button role="tab" data-v="marca">Marca</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<dialog id="dlg"><form method="dialog" id="frm"></form></dialog>
<div class="toast" id="toast" hidden></div>

<script>
const PIL={
  valor:{name:"Contenido de valor",short:"Valor",day:1,subs:["Consejos","Preguntas frecuentes","Mitos y verdades de la marca"]},
  exp:{name:"Contenido de experiencia",short:"Experiencia",day:3,subs:["Eventos","Uso de las camionetas","Equipo de taller o vendedores","Entrega o atención al cliente"]},
  prod:{name:"Contenido de producto",short:"Producto",day:5,subs:["Modelos","Funciones o accesorios","Comparativas","Financiación"]}
};
const ESTADOS=["Idea","Guion","Grabado","Editado","Publicado"];
const FORMATOS=["Reel","Carrusel","Feed","Historia","WhatsApp"];
const REDES=["Instagram","TikTok","Facebook","WhatsApp"];
const DIAS=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

const S={posts:[],tasks:[],ideas:[],brand:null};
let db=null, view="hoy", calMonth=new Date(), ideaFilter="all", calFilter="all";
const DEF_BRAND={tono:"Cercano, claro y confiable. Hablamos como un vendedor que sabe de autos y del sur: sin vueltas, con datos concretos y siempre con una salida a WhatsApp.",
  metas:["3 publicaciones por semana (L/M/V)","Cada auto del stock publicado al menos una vez por mes","Responder consultas de WhatsApp en menos de 1 hora"],
  subs:{valor:PIL.valor.subs,exp:PIL.exp.subs,prod:PIL.prod.subs},
  desc:{valor:"Educa y genera confianza: lo que hay que saber antes de comprar un usado en Tierra del Fuego.",exp:"Muestra personas reales: clientes, equipo y lo que pasa en la agencia.",prod:"Vende: los autos, lo que traen y cómo se pagan."}};
const brand=()=>Object.assign({},DEF_BRAND,S.brand||{});

/* ---------- datos: copia local + Google Sheets ---------- */
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const local={get(k){try{return JSON.parse(localStorage.getItem("cos_"+k))}catch(e){return null}},set(k,v){try{localStorage.setItem("cos_"+k,JSON.stringify(v))}catch(e){}}};
const SEED={posts:[
 {id:"p1",title:"5 cosas que tenés que mirar en un usado",date:"2026-11-02",pilar:"valor",sub:"Consejos",formato:"Reel",red:"Instagram",estado:"Guion",descripcion:"Reel educativo: cómo revisar un usado antes de comprarlo.",gancho:"Antes de comprar un usado en Río Grande, mirá esto.",guion:"0–3s: gancho a cámara al lado de un auto.\n3–20s: 1. Papeles y transferencia. 2. Desgaste de cubiertas. 3. Óxido abajo (sal y ripio). 4. Calefacción y desempañador. 5. Historial de service.\n20–25s: \"En Sevillano cada auto pasa por esta revisión.\" CTA: escribinos al WhatsApp."},
 {id:"p2",title:"Entregas Sevillano: llaves en mano",date:"2026-11-04",pilar:"exp",sub:"Entrega o atención al cliente",formato:"Reel",red:"Instagram",estado:"Idea",descripcion:"Entrega real de un auto a un cliente (pedir permiso para filmar y etiquetar).",gancho:"Así se va [nombre] con su primer auto.",guion:"0–3s: llaves en mano en primer plano.\n3–12s: cliente recorriendo el auto, foto con el vendedor.\n12–20s: una frase del cliente: ¿por qué Sevillano?\nCierre: \"El próximo podés ser vos.\""},
 {id:"p3",title:"El elegido de la semana",date:"2026-11-06",pilar:"prod",sub:"Modelos",formato:"Reel",red:"Instagram",estado:"Idea",descripcion:"Presentación de un auto destacado del stock.",gancho:"Este auto no va a durar el fin de semana.",guion:"0–3s: toma frontal + precio en pantalla.\n3–15s: exterior, interior, tablero con km, baúl.\n15–22s: año, km, equipamiento.\nCTA: reservalo hoy por WhatsApp, Sebastián Elcano 367."},
 {id:"p4",title:"Mitos y verdades del invierno fueguino",date:"2026-11-09",pilar:"valor",sub:"Mitos y verdades de la marca",formato:"Carrusel",red:"Instagram",estado:"Idea",descripcion:"Mitos comunes sobre preparar el auto para el invierno en Tierra del Fuego.",gancho:"¿Mito o verdad? Si tu auto no tiene esto, no pasa el invierno.",guion:"Slide 1: gancho.\nSlides 2–5: cubiertas de invierno, batería, anticongelante, plumillas (mito o verdad + explicación corta).\nCierre: guardalo y compartilo."},
 {id:"p5",title:"El equipo de taller prepara un usado",date:"2026-11-11",pilar:"exp",sub:"Equipo de taller o vendedores",formato:"Reel",red:"Instagram",estado:"Idea",descripcion:"Detrás de escena: cómo llega y se prepara un usado, con el equipo de taller.",gancho:"Así llegó este auto… y así sale.",guion:"0–3s: antes/después en pantalla dividida.\n3–18s: recepción, revisión del taller, lavado, fotos.\n18–22s: \"Por eso son usados seleccionados.\" CTA: mirá el stock en la web."},
 {id:"p6",title:"3 opciones según tu presupuesto",date:"2026-11-13",pilar:"prod",sub:"Comparativas",formato:"Reel",red:"Instagram",estado:"Idea",descripcion:"Comparativa de 3 autos del stock en un mismo rango de precio.",gancho:"¿Tenés X millones? Estos son tus 3 autos.",guion:"0–3s: monto en pantalla.\n3–20s: 5–6s por auto con precio y un dato fuerte (sumar el 6% de transferencia).\n20–25s: decinos tu presupuesto por WhatsApp."}],
 ideas:[{id:"i1",title:"Preguntas frecuentes: ¿se puede financiar un usado?",pilar:"prod",sub:"Financiación",prioridad:"Alta",gancho:"La pregunta que más nos hacen por WhatsApp."},

async function importIdeas(){
  if(!sheetUrl){
    if(local.get("imp_ford1"))return;
    const now=new Date().toISOString();const have=new Set(S.ideas.map(i=>i.id));
    IMPORT_IDEAS.filter(i=>!have.has(i.id)).forEach(i=>S.ideas.push({...i,updated:now}));
    local.set("imp_ford1",true);persist();render();return;
  }
  if(S.imports&&S.imports.ford1)return;
  const have=new Set(S.ideas.map(i=>i.id));const falta=IMPORT_IDEAS.filter(i=>!have.has(i.id));
  importing=true;let n=0;
  try{
    for(const it of falta){const x={...it,updated:new Date().toISOString()};await api({action:"upsert",sheet:"ideas",item:x});S.ideas.push(x);n++;
      setStatus(true,"Cargando ideas "+n+"/"+falta.length+"…");if(n%5===0){persist();render()}}
    await api({action:"upsert",sheet:"config",item:{id:"imports",ford1:true}});S.imports={ford1:true};
    persist();render();setStatus(true,"Sincronizado con Google Sheets");if(n)toast(n+" ideas nuevas en el Banco de ideas");
  }catch(e){persist();render();setStatus(false,"Se cargaron "+n+" ideas. Recargá la página para seguir.")}
  importing=false;
}
let importing=false;
let sheetUrl=local.get("sheet")||"";
function setStatus(on,txt){document.getElementById("dot").classList.toggle("on",on);document.getElementById("syncTxt").textContent=txt}
async function api(body){
  const r=await fetch(sheetUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  const j=await r.json();if(!j.ok)throw new Error(j.error||"error");return j;
}
async function push(body){
  if(!sheetUrl)return;
  try{await api(body);setStatus(true,"Sincronizado con Google Sheets")}
  catch(e){setStatus(false,"Sin conexión: guardado en este navegador");toast("No se pudo sincronizar. Quedó guardado en este navegador.")}
}
function persist(){["posts","tasks","ideas"].forEach(k=>local.set(k,S[k]));local.set("brand",S.brand)}
async function save(coll,item){
  item={...item,updated:new Date().toISOString()};
  const i=S[coll].findIndex(x=>x.id===item.id);
  if(i>=0)S[coll][i]=item;else S[coll].push(item);
  persist();render();push({action:"upsert",sheet:coll,item});
}
async function remove(coll,id){
  S[coll]=S[coll].filter(x=>x.id!==id);persist();render();push({action:"delete",sheet:coll,id});
}
async function saveBrand(b){S.brand=b;persist();render();push({action:"upsert",sheet:"config",item:{id:"brand",...b}})}
async function pull(){
  if(!sheetUrl)return;
  if(importing||dlg.open||document.activeElement&&document.activeElement.isContentEditable)return;
  try{
    const j=await api({action:"all"});
    ["posts","tasks","ideas"].forEach(k=>S[k]=j.data[k]||[]);
    const b=(j.data.config||[]).find(x=>x.id==="brand");S.imports=(j.data.config||[]).find(x=>x.id==="imports")||null;S.brand=b||S.brand;
    persist();render();setStatus(true,"Sincronizado con Google Sheets");
  }catch(e){setStatus(false,"Sin conexión: mostrando la copia de este navegador")}
}
async function init(){
  const has=local.get("posts");
  ["posts","tasks","ideas"].forEach(k=>S[k]=local.get(k)||(has?[]:SEED[k]));S.brand=local.get("brand");
  if(!has)persist();
  render();
  if(!sheetUrl){setStatus(false,"Sin sincronizar · tocá para conectar");importIdeas();return}
  setStatus(false,"Sincronizando…");
  await pull();
  if(!has&&!S.posts.length){S.posts=SEED.posts;S.ideas=SEED.ideas;persist();render();for(const k of ["posts","ideas"])for(const it of SEED[k])await push({action:"upsert",sheet:k,item:it})}
  await importIdeas();
  setInterval(pull,60000);
}
function openSync(){
  frm.innerHTML=`<div class="mh"><h2>Sincronizar con Google Sheets</h2></div>
  <div class="mb"><div class="full sub" style="font-size:13px;line-height:1.6">
  1. Abrí la planilla del Content OS (o creá una en sheets.new).<br>
  2. Andá a <b>Extensiones → Apps Script</b>, borrá todo y pegá el código de <b>apps-script.gs</b>.<br>
  3. <b>Implementar → Nueva implementación</b> → tipo <b>Aplicación web</b>, ejecutar como <b>Yo</b>, acceso <b>Cualquier usuario</b>.<br>
  4. Copiá la URL que termina en <b>/exec</b> y pegala acá. Cada compañero hace solo este último paso.</div>
  <label class="full">URL de la aplicación web<input id="s_url" value="${esc(sheetUrl)}" placeholder="https://script.google.com/macros/s/…/exec"></label></div>
  <div class="mf">${sheetUrl?`<button type="button" class="btn danger" data-off>Desconectar</button>`:""}<span class="sp"></span><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri">Guardar y conectar</button></div>`;
  frm.querySelector("[data-close]").onclick=()=>dlg.close();
  const off=frm.querySelector("[data-off]");if(off)off.onclick=()=>{sheetUrl="";local.set("sheet","");dlg.close();setStatus(false,"Sin sincronizar · tocá para conectar")};
  frm.onsubmit=async e=>{e.preventDefault();const u=frm.querySelector("#s_url").value.trim();
    if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){toast("La URL tiene que empezar con script.google.com y terminar en /exec");return}
    sheetUrl=u;local.set("sheet",u);dlg.close();setStatus(false,"Sincronizando…");
    const before={posts:S.posts,tasks:S.tasks,ideas:S.ideas};
    try{const j=await api({action:"all"});
      if(!(j.data.posts||[]).length&&before.posts.length){for(const k of ["posts","tasks","ideas"])for(const it of before[k])await api({action:"upsert",sheet:k,item:it});if(S.brand)await api({action:"upsert",sheet:"config",item:{id:"brand",...S.brand}});toast("Subimos tus datos a la planilla")}
      await pull();
    }catch(err){setStatus(false,"No se pudo conectar");toast("No se pudo conectar. Revisá que el acceso sea 'Cualquier usuario'.")}
  };
  dlg.showModal();
}

/* ---------- helpers ---------- */
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const todayS=()=>ymd(new Date());
const fmtDay=s=>{const d=parse(s);return `${DIAS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`};
const pillOf=p=>p&&PIL[p]?`<span class="pill p-${p}">${PIL[p].short}</span>`:`<span class="pill p-none">Sin pilar</span>`;
function pillarForDate(s){const g=parse(s).getDay();return g===1?"valor":g===3?"exp":g===5?"prod":""}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function gcal(title,date,time,details){
  const d=date.replace(/-/g,"");let dates;
  if(time){const[h,m]=time.split(":").map(Number);const e=new Date(2000,0,1,h+1,m);dates=`${d}T${time.replace(":","")}00/${d}T${String(e.getHours()).padStart(2,"0")}${String(e.getMinutes()).padStart(2,"0")}00`}
  else{const n=parse(date);n.setDate(n.getDate()+1);dates=`${d}/${ymd(n).replace(/-/g,"")}`}
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${dates}&details=${encodeURIComponent(details||"")}&ctz=America/Argentina/Ushuaia`;
}
function weekDates(){const n=new Date();const g=n.getDay();const mon=new Date(n);mon.setDate(n.getDate()-((g+6)%7));return [0,2,4].map(o=>{const d=new Date(mon);d.setDate(mon.getDate()+o);return ymd(d)})}

/* ---------- vistas ---------- */
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===view));
  const m=document.getElementById("main");
  m.innerHTML=({hoy:vHoy,cal:vCal,prod:vProd,ideas:vIdeas,marca:vMarca})[view]();
  bind();
}
function vHoy(){
  const t=todayS(), wd=weekDates();
  const slots=wd.map((d,i)=>{const pk=["valor","exp","prod"][i];const ps=S.posts.filter(p=>p.date===d);
    return `<div class="slot ${pk}" data-newpost="${d}" tabindex="0">
      <div class="row"><span class="day">${["Lunes","Miércoles","Viernes"][i]}</span><span class="sp"></span><span class="eyebrow">${fmtDay(d)}</span></div>
      ${pillOf(pk)}
      ${ps.length?ps.map(p=>`<div data-post="${p.id}"><div class="t">${esc(p.title)}</div><div class="row" style="margin-top:4px"><span class="chip">${esc(p.estado||"Idea")}</span><span class="chip">${esc(p.formato||"")}</span></div></div>`).join(""):`<div class="empty">Sin publicación. Tocá para planificarla.</div>`}
    </div>`}).join("");
  const pend=S.tasks.filter(x=>!x.done).sort((a,b)=>(a.date||"9")+(a.time||"")>(b.date||"9")+(b.time||"")?1:-1);
  const hoyT=pend.filter(x=>x.date&&x.date<=t);
  const prox=pend.filter(x=>!x.date||x.date>t).slice(0,8);
  const atras=S.posts.filter(p=>p.date<t&&p.estado!=="Publicado");
  const mes=new Date().getMonth();const pubMes=S.posts.filter(p=>p.estado==="Publicado"&&parse(p.date).getMonth()===mes).length;
  const enProd=S.posts.filter(p=>p.estado!=="Publicado"&&p.estado!=="Idea").length;
  return `
  <div class="row"><div><div class="eyebrow">${DIAS[new Date().getDay()]} ${new Date().getDate()} de ${MESES[new Date().getMonth()]}</div><h1>Esta semana en redes</h1></div><span class="sp"></span>
  <button class="btn" data-act="newtask">+ Tarea / reunión</button><button class="btn pri" data-act="newpost">+ Publicación</button></div>
  <div class="stats">
    <div class="card stat"><div class="eyebrow">Publicadas este mes</div><div class="n">${pubMes}</div></div>
    <div class="card stat"><div class="eyebrow">En producción</div><div class="n">${enProd}</div></div>
    <div class="card stat"><div class="eyebrow">Atrasadas</div><div class="n" style="color:${atras.length?"var(--warn)":"inherit"}">${atras.length}</div></div>
    <div class="card stat"><div class="eyebrow">Ideas guardadas</div><div class="n">${S.ideas.length}</div></div>
  </div>
  <div class="today-grid">
    <section><h2 style="margin-bottom:10px">Publicaciones L · M · V</h2><div class="week">${slots}</div>
      ${atras.length?`<h2 style="margin:22px 0 10px">Atrasadas</h2><div class="list">${atras.map(p=>`<div class="item" data-post="${p.id}"><span class="when">${fmtDay(p.date)}</span><div class="txt"><div class="t">${esc(p.title)}</div><div class="row">${pillOf(p.pilar)}<span class="chip">${esc(p.estado)}</span></div></div></div>`).join("")}</div>`:""}
    </section>
    <section>
      <h2 style="margin-bottom:10px">Para hoy</h2>
      <div class="list">${hoyT.length?hoyT.map(taskRow).join(""):`<div class="empty">Nada pendiente para hoy.</div>`}</div>
      <h2 style="margin:22px 0 10px">Próximo</h2>
      <div class="list">${prox.length?prox.map(taskRow).join(""):`<div class="empty">Cargá reuniones, eventos y tareas con “+ Tarea / reunión”.</div>`}</div>

}
function taskRow(x){return `<div class="item ${x.done?"done":""}" data-task="${x.id}"><button class="check ${x.done?"on":""}" data-toggle="${x.id}" aria-label="Marcar como hecha"></button><span class="when">${x.date?fmtDay(x.date):"Sin fecha"}${x.time?"<br>"+x.time:""}</span><div class="txt"><div class="kind k-${x.tipo||"tarea"}">${esc(x.tipo||"tarea")}</div><div class="t">${esc(x.title)}</div>${x.lugar?`<div class="sub" style="font-size:12px">${esc(x.lugar)}</div>`:""}</div></div>`}

function vCal(){
  const y=calMonth.getFullYear(),mo=calMonth.getMonth();
  const first=new Date(y,mo,1);const start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  const t=todayS();let cells="";
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=ymd(d);const out=d.getMonth()!==mo;
    if(i>=35&&out&&d.getDate()>7)break;
    const pk=pillarForDate(s);
    const ps=calFilter==="tasks"?[]:S.posts.filter(p=>p.date===s&&(calFilter==="all"||p.pilar===calFilter));
    const ts=calFilter==="all"||calFilter==="tasks"?S.tasks.filter(x=>x.date===s):[];
    cells+=`<div class="cell ${out?"out":""} ${s===t?"today":""}"><div class="num"><b>${DIAS[d.getDay()]} ${d.getDate()}</b>${pk?`<span class="tag" style="color:var(--${pk})">${PIL[pk].short}</span>`:""}<button class="add" data-newpost="${s}" aria-label="Agregar en ${s}">+</button></div>
      ${ps.map(p=>`<div class="ev ${p.pilar||"task"} ${p.estado==="Publicado"?"pubd":""}" data-post="${p.id}" title="${esc(p.title)}">${esc(p.title)}</div>`).join("")}
      ${ts.map(x=>`<div class="ev task ${x.done?"pubd":""}" data-task="${x.id}">${x.time?x.time+" ":""}${esc(x.title)}</div>`).join("")}</div>`;}
  const f=(k,l)=>`<button aria-pressed="${calFilter===k}" data-calf="${k}">${l}</button>`;
  return `<div class="row"><h1 style="text-transform:capitalize">${MESES[mo]} ${y}</h1><span class="sp"></span>
    <button class="btn" data-cal="-1" aria-label="Mes anterior">‹</button><button class="btn" data-cal="0">Hoy</button><button class="btn" data-cal="1" aria-label="Mes siguiente">›</button>
    <button class="btn" data-act="newtask">+ Tarea / reunión</button><button class="btn pri" data-act="newpost">+ Publicación</button></div>
    <div class="filters">${f("all","Todo")}${f("valor","Valor")}${f("exp","Experiencia")}${f("prod","Producto")}${f("tasks","Tareas y reuniones")}</div>
    <div class="cal-head">${["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(d=>`<div>${d}</div>`).join("")}</div>
    <div class="cal">${cells}</div>`;
}
function vProd(){
  const cols=ESTADOS.map(e=>{const ps=S.posts.filter(p=>(p.estado||"Idea")===e).sort((a,b)=>a.date>b.date?1:-1);

      ${ps.map(p=>{const k=ESTADOS.indexOf(e);return `<div class="kcard ${p.pilar||""}" draggable="true" data-drag="${p.id}" data-post="${p.id}">

const dlg=document.getElementById("dlg"),frm=document.getElementById("frm");

    <span class="sp"></span><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" value="ok">Guardar</button></div>`;

function wireModal(onDel){
  frm.querySelector("[data-close]").onclick=()=>dlg.close();

}

/* ---------- eventos ---------- */
function bind(){
  const m=document.getElementById("main");
  m.onclick=e=>{
    const t=e.target.closest("[data-toggle],[data-move],[data-post],[data-task],[data-idea],[data-newpost],[data-act],[data-cal],[data-calf],[data-ideaf],[data-addsub],[data-addmeta]");if(!t)return;
    const d=t.dataset;
    if(d.toggle){e.stopPropagation();const x=S.tasks.find(x=>x.id===d.toggle);save("tasks",{...x,done:!x.done});return}
    if(d.move){e.stopPropagation();const p=S.posts.find(x=>x.id===d.move);save("posts",{...p,estado:d.to});return}
    if(d.post)return openPost(d.post);
    if(d.task)return openTask(d.task);
    if(d.idea)return openIdea(d.idea);
    if(d.newpost)return openPost(null,d.newpost);
    if(d.act==="newpost")return openPost(null,null);
    if(d.act==="newtask")return openTask(null);
    if(d.act==="newidea")return openIdea(null);
    if(d.cal!==undefined){calMonth=d.cal==="0"?new Date():new Date(calMonth.getFullYear(),calMonth.getMonth()+Number(d.cal),1);render();return}
    if(d.calf){calFilter=d.calf;render();return}
    if(d.ideaf){ideaFilter=d.ideaf;render();return}
    if(d.addsub!==undefined){const b=structuredClone(brand());b.subs[d.addsub]=[...b.subs[d.addsub],"Nuevo subtema"];saveBrand(b);return}
    if(d.addmeta!==undefined){const b=structuredClone(brand());b.metas=[...b.metas,"Nueva meta"];saveBrand(b);return}
  };
  m.onkeydown=e=>{if(e.key==="Enter"&&e.target.matches(".slot")){e.target.click()}};
  m.querySelectorAll("[contenteditable]").forEach(el=>{
    el.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();el.blur()}};
    el.onblur=()=>{const b=structuredClone(brand());const v=el.textContent.trim();const d=el.dataset;
      if(d.bsub){if(v)b.subs[d.bsub][d.i]=v;else b.subs[d.bsub].splice(d.i,1)}
      else if(d.bdesc)b.desc[d.bdesc]=v;
      else if(d.btono!==undefined)b.tono=v;
      else if(d.bmeta!==undefined){if(v)b.metas[d.bmeta]=v;else b.metas.splice(d.bmeta,1)}
      if(JSON.stringify(b)!==JSON.stringify(brand()))saveBrand(b);};
  });
  m.querySelectorAll("[data-drag]").forEach(c=>c.ondragstart=e=>e.dataTransfer.setData("text/plain",c.dataset.drag));
  m.querySelectorAll("[data-col]").forEach(col=>{
    col.ondragover=e=>{e.preventDefault();col.classList.add("over")};
    col.ondragleave=()=>col.classList.remove("over");
    col.ondrop=e=>{e.preventDefault();col.classList.remove("over");const id=e.dataTransfer.getData("text/plain");const p=S.posts.find(x=>x.id===id);if(p&&p.estado!==col.dataset.col)save("posts",{...p,estado:col.dataset.col})};
  });
}
document.getElementById("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;view=b.dataset.v;render();try{localStorage.setItem("cos_view",view)}catch(_){}};
try{const v=localStorage.getItem("cos_view");if(v)view=v}catch(_){}
document.getElementById("syncBtn").onclick=openSync;
init();
</script>
